name: ci

# Sidekick builds against a FrogBot checkout beside it (`../frogbot`), so each job checks out
# both repos side by side and installs FrogBot first. `checks` and `e2e` run in parallel; the
# `ci` job gates on both because the ruleset and automerge wait on a check named `ci`.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: sidekick
      - uses: actions/checkout@v5
        with:
          repository: frogbotai/frogbot
          path: frogbot
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sidekick/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            sidekick/pnpm-lock.yaml
            frogbot/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frogbot
      - run: pnpm install --frozen-lockfile
        working-directory: sidekick
      - run: pnpm prettier
        working-directory: sidekick
      - run: pnpm typecheck
        working-directory: sidekick
      - run: pnpm lint
        working-directory: sidekick
      - run: pnpm test:unit
        working-directory: sidekick

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: sidekick
      - uses: actions/checkout@v5
        with:
          repository: frogbotai/frogbot
          path: frogbot
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sidekick/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            sidekick/pnpm-lock.yaml
            frogbot/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frogbot
      - run: pnpm install --frozen-lockfile
        working-directory: sidekick
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: sidekick
      - run: pnpm test:e2e --reporter=list
        working-directory: sidekick
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: sidekick/node_modules/.cache/playwright
          retention-days: 7

  ci:
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: test "$CHECKS" = success && test "$E2E" = success
        env:
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
