<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tool bench</title>
    <style>
      main {
        display: grid;
        gap: 1rem;
        max-width: 30rem;
      }

      #below {
        margin-top: 150vh;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tool bench</h1>
      <button type="button">Sign in</button>
      <label>Name <input name="name" /></label>
      <label><input type="checkbox" name="remember" /> Remember me</label>
      <label for="color">Color</label>
      <select id="color" name="color">
        <option>red</option>
        <option>blue</option>
      </select>
      <button type="button" draggable="true">Card A</button>
      <button type="button">Done</button>
      <a id="below" href="#pricing">Pricing</a>
    </main>
  </body>
</html>
