<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job application</title>
  </head>
  <body>
    <main>
      <h1>Job application</h1>
      <label>Full name <input id="name" /></label>
      <label>Resume <input id="resume" type="file" /></label>
      <p id="chosen">No file chosen</p>
      <label for="cover" role="button">Upload cover letter</label>
      <input id="cover" type="file" accept=".pdf" style="display: none" />
    </main>
    <script>
      window.changes = 0;

      document.getElementById('resume').addEventListener('change', (event) => {
        window.changes += 1;
        document.getElementById('chosen').textContent = Array.from(event.target.files)
          .map((file) => file.name)
          .join(', ');
      });
    </script>
  </body>
</html>
