<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nested scrollers</title>
    <style>
      body {
        margin: 0;
        font:
          16px system-ui,
          sans-serif;
      }
      #outer {
        height: 200px;
        width: 500px;
        overflow: auto;
        border: 1px solid #888;
      }
      #inner {
        height: 150px;
        width: 400px;
        overflow: auto;
        border: 1px solid #c55;
        margin: 20px;
      }
      .tall {
        height: 1200px;
      }
      .short {
        height: 400px;
      }
      .page {
        height: 2000px;
      }
    </style>
  </head>
  <body>
    <h1>Nested scrollers</h1>
    <div id="outer" aria-label="Outer scroller">
      <p>Outer top</p>
      <div id="inner" aria-label="Inner scroller">
        <button id="inner-button" type="button">Inner button</button>
        <div class="short"></div>
        <p>Inner bottom</p>
      </div>
      <div class="tall"></div>
      <button id="outer-button" type="button">Outer button</button>
    </div>
    <div class="page"></div>
    <script>
      window.scrolls = () => ({
        page: scrollY,
        outer: document.getElementById('outer').scrollTop,
        inner: document.getElementById('inner').scrollTop,
      });
    </script>
  </body>
</html>
